name: Run Distros Framework

on:
  push:

  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout distros
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Cache Go Modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build Docker image
        run: docker build . -q -f scripts/Dockerfile.build -t acceptance-tests

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Get list of changed files
        id: get-changed-files
        run: |
          base_sha="${{ github.event.pull_request.base.sha || github.event.before }}"
          files=$(git diff --name-only "$base_sha" "${{ github.sha }}" | grep -E '(^|/).*\.go$|^go\.(mod|sum)$|^\.golangci\.ya?ml$' || true)
          if [ -z "$files" ]; then
            echo "No lint inputs changed in this PR"
            echo "lint_inputs_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed lint inputs: $files"
            echo "lint_inputs_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: golangci-lint
        if: steps.get-changed-files.outputs.lint_inputs_changed == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout 10m
        continue-on-error: false
