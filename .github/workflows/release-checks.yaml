name: Run Release Checks

on:
  workflow_dispatch:
    inputs:
      k3s_versions:
        description: |
          'Provide the list of k3s versions (comma separated)
          Ex: v1.34.0-rc1+k3s1,v1.33.4-rc1+k3s1,v1.32.8-rc1+k3s1,v1.31.12-rc1+k3s1'
        required: false
      rke2_versions:
        description: |
          'Provide the list of rke2 versions (comma separated)
          Ex: v1.34.0-rc1+rke2r1,v1.33.4-rc1+rke2r1,v1.32.8-rc1+rke2r1,v1.31.12-rc1+rke2r1'
        required: false
      rke2_lts_versions:
        description: |
          'Provide the list of rke2 lts versions to test prime registry (comma separated)
          Ex: v1.30.14-rc1+rke2r3'
        required: false
      page_size:
        description: 'Page size for API queries'
        required: false
        default: '150'
      commit_baselines:
        description: 'Optional GA-to-RC baselines as JSON: {"<RC tag>":"<GA tag>"}; otherwise auto-select within each minor'
        required: false
        default: '{}'

permissions:
  contents: read

jobs:
  run-script-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Update and install necessary packages
        run: sudo apt-get update && sudo apt-get install -y jq curl skopeo

      - name: Change permissions and make script executable (if needed)
        working-directory: ./scripts
        run: chmod +x ./release_checks.sh

      - name: Verify K3S versions - run captain shell script
        working-directory: ./scripts
        id: k3s_verify
        if: ${{ github.event.inputs.k3s_versions != '' }}
        run: ./release_checks.sh -v "${{ github.event.inputs.k3s_versions }}"  -d -p "${{ github.event.inputs.page_size }}"
        shell: sh
        continue-on-error: true

      - name: Verify RKE2 versions - run captain shell script
        working-directory: ./scripts
        id: rke2_verify
        if: ${{ github.event.inputs.rke2_versions != '' }}
        run: ./release_checks.sh -v "${{ github.event.inputs.rke2_versions }}"  -d -p "${{ github.event.inputs.page_size }}"
        shell: sh
        continue-on-error: true

      - name: Verify LTS RKE2 versions - run captain shell script
        working-directory: ./scripts
        id: rke2_lts_verify
        if: ${{ github.event.inputs.rke2_lts_versions != '' }}
        run: ./release_checks.sh -l "${{ github.event.inputs.rke2_lts_versions }}"  -d
        shell: sh

      - name: Compare GA to RC commits
        id: commit_compare
        if: ${{ !cancelled() }}
        shell: bash
        timeout-minutes: 20
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          K3S_VERSIONS: ${{ inputs.k3s_versions }}
          RKE2_VERSIONS: ${{ inputs.rke2_versions }}
          RKE2_LTS_VERSIONS: ${{ inputs.rke2_lts_versions }}
          BASELINES: ${{ inputs.commit_baselines }}
          REQUEST_ID: ${{ github.run_id }}
        run: |
          rc_versions=$(jq -rn --arg versions "$K3S_VERSIONS,$RKE2_VERSIONS,$RKE2_LTS_VERSIONS" '
            $versions | split(",") | map(gsub("^\\s+|\\s+$"; "")) |
            map(select(contains("-rc"))) | join(",")
          ')
          if [[ -z "$rc_versions" ]]; then
            echo 'No RC tags supplied; GA-only artifact checks are unchanged.'
            exit 0
          fi
          bash scripts/compare_release_commits.sh --versions "$rc_versions" \
            --baselines "$BASELINES" --request-id "$REQUEST_ID" --output-dir tmp/release-commits

      - name: Upload commit comparison report even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-commit-comparison
          path: |
            tmp/release-commits/report.json
            tmp/release-commits/summary.md
          if-no-files-found: warn
          retention-days: 30

      - name: Check for previous failures
        if: ${{ !cancelled() && (steps.k3s_verify.outcome == 'failure' || steps.rke2_verify.outcome == 'failure' || steps.rke2_lts_verify.outcome == 'failure' || steps.commit_compare.outcome == 'failure') }}
        run: |
          echo "One or more steps failed, marking job as failed."
          exit 1
