name: Run Release Checks

on:
  workflow_dispatch:
    inputs:
      k3s_versions:
        description: |
          'Provide the list of k3s versions (comma separated)
          Ex: v1.34.0-rc1+k3s1,v1.33.4-rc1+k3s1,v1.32.8-rc1+k3s1,v1.31.12-rc1+k3s1'
        required: false
      rke2_versions:
        description: |
          'Public RKE2 releases (comma separated). Use rke2_lts_versions for Prime-only/LTS releases.
          Ex: v1.34.0-rc1+rke2r1,v1.33.4-rc1+rke2r1,v1.32.8-rc1+rke2r1,v1.31.12-rc1+rke2r1'
        required: false
      rke2_lts_versions:
        description: |
          'Prime-only/LTS RKE2 releases: artifact index, Prime images and signed RPM repositories.
          Ex: v1.32.13-rc1+rke2r3'
        required: false
      rke2_lts_rpm_targets:
        description: 'LTS RPM distro/arch targets (comma separated); e.g. slemicro/x86_64,centos/9/aarch64'
        required: false
        default: 'slemicro/x86_64'
      page_size:
        description: 'Page size for API queries'
        required: false
        default: '150'

permissions:
  contents: read

jobs:
  run-script-job:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Update and install necessary packages
        run: sudo apt-get update && sudo apt-get install -y jq curl skopeo python3 gnupg gpgv

      - name: Test release checks locally
        run: python3 -m unittest discover -s scripts -p 'test_release_checks*.py' -v

      - name: Change permissions and make script executable (if needed)
        working-directory: ./scripts
        run: chmod +x ./release_checks.sh

      - name: Verify K3S versions - run captain shell script
        working-directory: ./scripts
        id: k3s_verify
        if: ${{ github.event.inputs.k3s_versions != '' }}
        env:
          VERSIONS: ${{ github.event.inputs.k3s_versions }}
          PAGE_SIZE: ${{ github.event.inputs.page_size }}
        run: ./release_checks.sh -v "$VERSIONS" -d -p "$PAGE_SIZE"
        shell: sh
        continue-on-error: true

      - name: Verify RKE2 versions - run captain shell script
        working-directory: ./scripts
        id: rke2_verify
        if: ${{ github.event.inputs.rke2_versions != '' }}
        env:
          VERSIONS: ${{ github.event.inputs.rke2_versions }}
          PAGE_SIZE: ${{ github.event.inputs.page_size }}
        run: ./release_checks.sh -v "$VERSIONS" -d -p "$PAGE_SIZE"
        shell: sh
        continue-on-error: true

      - name: Verify LTS RKE2 versions - run captain shell script
        working-directory: ./scripts
        id: rke2_lts_verify
        if: ${{ github.event.inputs.rke2_lts_versions != '' }}
        env:
          VERSIONS: ${{ github.event.inputs.rke2_lts_versions }}
          LTS_RPM_TARGETS: ${{ github.event.inputs.rke2_lts_rpm_targets }}
        run: ./release_checks.sh -l "$VERSIONS" -d
        continue-on-error: true
        shell: sh

      - name: Check for previous failures
        if: steps.k3s_verify.outcome == 'failure' || steps.rke2_verify.outcome == 'failure' || steps.rke2_lts_verify.outcome == 'failure'
        run: |
          echo "One or more steps failed, marking job as failed."
          exit 1

