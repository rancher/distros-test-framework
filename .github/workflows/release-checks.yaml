name: Run Release Checks

on:
  workflow_dispatch:
    inputs:
      k3s_versions:
        description: |
          'Provide the list of k3s versions (comma separated)
          Ex: v1.34.0-rc1+k3s1,v1.33.4-rc1+k3s1,v1.32.8-rc1+k3s1,v1.31.12-rc1+k3s1'
        required: false
      rke2_versions:
        description: |
          'Public RKE2 releases (comma separated). Use rke2_lts_versions for Prime-only/LTS releases.
          Ex: v1.34.0-rc1+rke2r1,v1.33.4-rc1+rke2r1,v1.32.8-rc1+rke2r1,v1.31.12-rc1+rke2r1'
        required: false
      rke2_lts_versions:
        description: |
          'Prime-only/LTS RKE2 releases: artifact index, Prime images and signed RPM repositories.
          Ex: v1.32.13-rc1+rke2r3'
        required: false
      rke2_lts_rpm_targets:
        description: 'LTS RPM distro/arch targets (comma separated); e.g. slemicro/x86_64,centos/9/aarch64'
        required: false
        default: 'slemicro/x86_64'
      page_size:
        description: 'Page size for API queries'
        required: false
        default: '150'
      commit_baselines:
        description: >-
          GA-to-RC baselines as JSON: {"<RC tag>":"<GA tag>"}; blank means automatic within each minor.
          A new-minor .0 RC without a preceding GA requires an explicit baseline; otherwise the job fails.
        required: false
        default: '{}'

permissions:
  contents: read

jobs:
  run-script-job:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Update and install necessary packages
        run: sudo apt-get update && sudo apt-get install -y jq curl skopeo gnupg gpgv libxml2-utils

      - name: Change permissions and make script executable (if needed)
        working-directory: ./scripts
        run: chmod +x ./release_checks.sh

      - name: Verify K3S versions - run captain shell script
        working-directory: ./scripts
        id: k3s_verify
        if: ${{ inputs.k3s_versions != '' }}
        env:
          VERSIONS: ${{ inputs.k3s_versions }}
          PAGE_SIZE: ${{ inputs.page_size }}
          PRIME_RC_REGISTRY: ${{ secrets.PRIME_RC_REGISTRY }}
        run: ./release_checks.sh -v "$VERSIONS" -d -p "$PAGE_SIZE"
        shell: sh
        continue-on-error: true

      - name: Verify RKE2 versions - run captain shell script
        working-directory: ./scripts
        id: rke2_verify
        if: ${{ inputs.rke2_versions != '' }}
        env:
          VERSIONS: ${{ inputs.rke2_versions }}
          PAGE_SIZE: ${{ inputs.page_size }}
          PRIME_RC_REGISTRY: ${{ secrets.PRIME_RC_REGISTRY }}
        run: ./release_checks.sh -v "$VERSIONS" -d -p "$PAGE_SIZE"
        shell: sh
        continue-on-error: true

      - name: Verify LTS RKE2 versions - run captain shell script
        working-directory: ./scripts
        id: rke2_lts_verify
        if: ${{ inputs.rke2_lts_versions != '' }}
        env:
          VERSIONS: ${{ inputs.rke2_lts_versions }}
          LTS_RPM_TARGETS: ${{ inputs.rke2_lts_rpm_targets }}
          LTS_ARTIFACT_BASE_URL: ${{ secrets.LTS_ARTIFACT_BASE_URL }}
          PRIME_RC_REGISTRY: ${{ secrets.PRIME_RC_REGISTRY }}
        run: ./release_checks.sh -l "$VERSIONS" -d
        shell: sh
        continue-on-error: true

      - name: Compare GA to RC commits
        id: commit_compare
        if: ${{ !cancelled() }}
        shell: bash
        timeout-minutes: 20
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          K3S_VERSIONS: ${{ inputs.k3s_versions }}
          RKE2_VERSIONS: ${{ inputs.rke2_versions }}
          RKE2_LTS_VERSIONS: ${{ inputs.rke2_lts_versions }}
          BASELINES: ${{ inputs.commit_baselines }}
          REQUEST_ID: ${{ github.run_id }}
        run: |
          if [[ -z "$BASELINES" ]]; then BASELINES='{}'; fi
          rc_versions=$(jq -rn --arg versions "$K3S_VERSIONS,$RKE2_VERSIONS,$RKE2_LTS_VERSIONS" '
            $versions | split(",") | map(gsub("^\\s+|\\s+$"; "")) |
            map(select(contains("-rc"))) | join(",")
          ')
          if [[ -z "$rc_versions" ]]; then
            echo 'No RC tags supplied; GA-only artifact checks are unchanged.'
            exit 0
          fi
          bash scripts/compare_release_commits.sh --versions "$rc_versions" \
            --baselines "$BASELINES" --request-id "$REQUEST_ID" --output-dir tmp/release-commits

      - name: Upload commit comparison report even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-commit-comparison
          path: |
            tmp/release-commits/report.json
            tmp/release-commits/summary.md
          if-no-files-found: warn
          retention-days: 30

      - name: Check for previous failures
        if: ${{ !cancelled() && (steps.k3s_verify.outcome == 'failure' || steps.rke2_verify.outcome == 'failure' || steps.rke2_lts_verify.outcome == 'failure' || steps.commit_compare.outcome == 'failure') }}
        run: |
          echo "One or more steps failed, marking job as failed."
          exit 1
