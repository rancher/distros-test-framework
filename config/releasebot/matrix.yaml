  - {name: k3s-secrets-encryption, product: k3s, controller: mower, phase: 2, code: se,
     path: distros_qa/k3s-tests/k3s_secrets_encryption_qainfra}
  - {name: k3s-cert-rotate, product: k3s, controller: mower, phase: 2, code: ro,
