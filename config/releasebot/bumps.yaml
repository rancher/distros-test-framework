# Release bot bump mode (-bumps): the jobs that validate bumps and the images a default install runs
# (docs/releasebot.md, "Bump issues"). Bumps never report to Qase: their MD goes on their issues.
controller: mower
jobs:
  k3s: distros_qa/k3s-tests/k3s-version-bump_qainfra
  rke2: distros_qa/rke2-tests/rke2-version-bump_qainfra
cniJobs:
  rke2:
    - name: canal
      job: distros_qa/rke2-tests/rke2-canal-version-bump_qainfra
      components: [rke2-canal, hardened-calico, hardened-flannel]
    - name: cilium
      job: distros_qa/rke2-tests/rke2-version-bump_qainfra
      components: [rke2-cilium, mirrored-cilium-cilium, mirrored-cilium-operator-generic]
defaultImages:
  rke2: [hardened-calico, hardened-flannel, hardened-cni-plugins, hardened-coredns, hardened-k8s-metrics-server,
         hardened-etcd, mirrored-cilium-cilium, mirrored-cilium-operator-generic]
  k3s: [mirrored-coredns-coredns, mirrored-metrics-server, local-path-provisioner, klipper-lb, klipper-helm,
        mirrored-library-traefik]
